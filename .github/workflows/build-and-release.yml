name: build-and-release

# Installer builds are owner-triggered. Artifacts stay in Actions; release
# publishing is hard-disabled and carries no write permission or signing secrets.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platforms to build; artifacts remain in Actions and are not published'
        type: choice
        options: [all, both, linux, windows, macos]
        default: all
      macos_arch:
        description: 'macOS architectures (Windows is x64)'
        type: choice
        options: [both, arm64, x64]
        default: both

permissions:
  contents: read

env:
  # Exact Code OSS sources.lock.json revision .nvmrc: 24.18.0.
  NODE_VERSION: '24.18.0'
  PYTHON_VERSION: '3.11'

jobs:
  linux:
    name: Build and verify (Linux x64)
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned editor build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cargo \
            dpkg-dev \
            jq \
            libasound2t64 \
            libgbm-dev \
            libgtk-3-0t64 \
            libkrb5-dev \
            libnss3 \
            libsecret-1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbfile-dev \
            pkg-config \
            python3 \
            rpm \
            rustc \
            xvfb

      - name: Report and check out pinned editor sources
        shell: bash
        run: |
          VSCODIUM_VERSION="$(node -p "require('./sources.lock.json').sources.vscodium.version")"
          CODE_OSS_VERSION="$(node -p "require('./sources.lock.json').sources.codeOss.version")"
          VSCODIUM_COMMIT="$(node -p "require('./sources.lock.json').sources.vscodium.commit")"
          CODE_OSS_COMMIT="$(node -p "require('./sources.lock.json').sources.codeOss.commit")"
          echo "VSCodium $VSCODIUM_VERSION ($VSCODIUM_COMMIT)"
          echo "Code OSS $CODE_OSS_VERSION ($CODE_OSS_COMMIT)"
          git clone --depth 1 --branch "$VSCODIUM_VERSION" https://github.com/VSCodium/vscodium.git build/vscodium
          git clone --depth 1 --branch "$CODE_OSS_VERSION" https://github.com/microsoft/vscode.git build/vscodium/vscode
          test "$(git -C build/vscodium rev-parse HEAD)" = "$VSCODIUM_COMMIT"
          test "$(git -C build/vscodium/vscode rev-parse HEAD)" = "$CODE_OSS_COMMIT"

      - name: Build and verify the Linux x64 editor
        env:
          MODERADO_TSGO_CONCURRENCY: '2'
          MODERADO_BUILD_HEAP_MB: '12288'
        run: node scripts/build-linux.mjs

      - name: Build Linux installer packages
        run: |
          ./scripts/build-deb.sh
          ./scripts/build-rpm.sh

      - name: Upload installers and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moderado-ide-linux-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            build/vscodium/assets/Moderado IDE-linux-x64-*.tar.gz
            build/vscodium/assets/build-manifest-linux.json
            build/installers/*.deb
            build/installers/*.rpm

  windows:
    name: Build and verify (Windows x64)
    if: ${{ inputs.platform == 'all' || inputs.platform == 'both' || inputs.platform == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # build-m1.ps1 records the commit; tags come from here

      - name: Report pinned revisions
        shell: pwsh
        run: |
          $lock = Get-Content -Raw sources.lock.json | ConvertFrom-Json
          foreach ($name in 'vscodium','codeOss','moderado') {
            if (-not $lock.sources.$name.commit) { throw "sources.lock.json is missing the $name commit." }
            Write-Host "$name = $($lock.sources.$name.commit)"
          }

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python 3.11
        # prepare-m1.ps1 hard-requires `py -3.11`; hosted images default to 3.13+.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build prerequisites
        shell: pwsh
        run: |
          # 7-Zip and jq are required by the VSCodium asset scripts and are not
          # preinstalled on hosted images.
          choco install --no-progress -y 7zip jq
          if ($LASTEXITCODE -ne 0) { throw 'choco install failed.' }
          if (-not (Test-Path 'C:\Program Files\7-Zip\7z.exe')) { throw '7-Zip not found after install.' }

      - name: Ensure Visual Studio C++ and Spectre prerequisites
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw 'Visual Studio C++ Build Tools are missing.' }
          $component = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre'
          $ready = & $vswhere -latest -products '*' -requires $component -property installationPath | Select-Object -First 1
          if (-not $ready) {
            $installer = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe'
            & $installer modify --installPath "$vs" --add $component --quiet --norestart
            if ($LASTEXITCODE -notin @(0, 3010)) { throw "Spectre installation failed: $LASTEXITCODE" }
          }
          $ready = & $vswhere -latest -products '*' -requires $component -property installationPath | Select-Object -First 1
          if (-not $ready) { throw 'Spectre component is still missing after installation.' }
          Write-Host "Visual Studio with Spectre: $ready"
          $ram = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1MB
          $heap = [Math]::Min(12288, [Math]::Floor($ram - 4096))
          if ($heap -lt 4096) { throw 'Runner needs at least 8 GiB RAM.' }
          "MODERADO_BUILD_HEAP_MB=$heap" >> $env:GITHUB_ENV

      - name: Vendor the pinned Moderado agent
        shell: pwsh
        run: |
          # Clones the pinned upstream commit; there is no sibling checkout on a
          # runner. The CLI tree is never modified.
          ./scripts/vendor-moderado.ps1 -CliRepository "${{ runner.temp }}\no-cli-checkout"

      - name: Build the vendored packages
        shell: pwsh
        run: |
          Push-Location vendor/moderado
          try {
            if (!(Test-Path -LiteralPath 'package.json')) { throw 'vendor package.json is missing; vendor-moderado.ps1 did not preserve the npm wrapper.' }
            if (!(Test-Path -LiteralPath 'package-lock.json')) { throw 'vendor package-lock.json is missing; vendor-moderado.ps1 did not preserve the npm wrapper.' }
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'vendor npm ci failed' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'vendor build failed' }
          } finally { Pop-Location }

      - name: Extension offline suite
        shell: pwsh
        run: |
          Push-Location extensions/moderado-agent
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'Agent extension install failed.' }
            npm test
            if ($LASTEXITCODE -ne 0) { throw 'Agent extension tests failed.' }
            npm run typecheck
            if ($LASTEXITCODE -ne 0) { throw 'Agent extension typecheck failed.' }
          } finally { Pop-Location }

      - name: Prepare the pinned editor source
        shell: pwsh
        run: ./scripts/prepare-m1.ps1

      - name: Verify Node matches the pinned editor
        shell: pwsh
        run: |
          $expected = (Get-Content -Raw build/vscodium/vscode/.nvmrc).Trim().TrimStart('v')
          if ($expected -ne '${{ env.NODE_VERSION }}') { throw "Pinned editor requires Node $expected; workflow must be reviewed." }

      - name: Build the editor and installers
        shell: pwsh
        env:
          MODERADO_TSGO_CONCURRENCY: '2'
        run: ./scripts/build-m1.ps1

      - name: Generate provenance and notices
        shell: pwsh
        run: ./scripts/gen-provenance.ps1

      - name: Verify the release evidence
        shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: Confirm the shipped archive contains the agent and licenses
        shell: pwsh
        run: |
          # A packaging regression can produce a healthy-looking editor with no
          # agent in it. Assert on the artifact, not the staging tree.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem build/vscodium/assets -Filter '*-win32-x64-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No portable archive was produced.' }
          $a = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entry = $a.Entries | Where-Object { $_.FullName -eq 'resources/app/extensions/moderado-agent/dist/extension.js' }
            if (-not $entry) { throw 'The agent is NOT in the shipped archive.' }
            Write-Host "agent entry present: $($entry.Length) bytes"
            if (-not ($a.Entries | Where-Object { $_.FullName -eq 'LICENSE.txt' })) {
              throw 'LICENSE.txt is missing from the shipped archive.'
            }
          } finally { $a.Dispose() }

      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moderado-ide-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            build/vscodium/assets/*.zip
            build/vscodium/assets/*.exe
            build/vscodium/assets/build-manifest.json
            build/vscodium/assets/provenance.json
            build/vscodium/assets/THIRD-PARTY-NOTICES.md
            build/vscodium/assets/release-verification.json

  macos-arm64:
    name: Build and verify (macOS arm64)
    if: ${{ (inputs.platform == 'all' || inputs.platform == 'both' || inputs.platform == 'macos') && (inputs.macos_arch == 'both' || inputs.macos_arch == 'arm64') }}
    runs-on: macos-14
    timeout-minutes: 180
    env:
      MODERADO_BUILD_HEAP_MB: '4096'
      MODERADO_TSGO_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install macOS build utilities
        run: brew install gnu-sed jq
      - name: Build the pinned editor and macOS installers
        run: node scripts/build-macos.mjs --arch arm64
      - name: Upload installers and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moderado-ide-macos-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            build/installers/**/*.dmg
            build/installers/**/*.zip
            build/installers/**/*.json
            build/installers/**/SHA256SUMS*

  macos-x64:
    name: Build and verify (macOS x64)
    if: ${{ (inputs.platform == 'all' || inputs.platform == 'both' || inputs.platform == 'macos') && (inputs.macos_arch == 'both' || inputs.macos_arch == 'x64') }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      MODERADO_BUILD_HEAP_MB: '10240'
      MODERADO_TSGO_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install macOS build utilities
        run: brew install gnu-sed jq
      - name: Build the pinned editor and macOS installers
        run: node scripts/build-macos.mjs --arch x64
      - name: Upload installers and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moderado-ide-macos-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            build/installers/**/*.dmg
            build/installers/**/*.zip
            build/installers/**/*.json
            build/installers/**/SHA256SUMS*

  publish:
    name: Publishing disabled
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Publishing requires a separate owner-authorized release.'
